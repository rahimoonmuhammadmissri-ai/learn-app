name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip (first time only)
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip && rm project.zip
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add -A && git commit -m "Add project files"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android folder
        run: |
          flutter create --platforms=android --org com.murad.learn --project-name learn_app .
          sed -i 's/android:label="[^"]*"/android:label="Learn"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" build/app/outputs/flutter-apk/app-release.apk --title "Learn build ${{ github.run_number }}" --notes "Phase 3A: STBB Math III test"
